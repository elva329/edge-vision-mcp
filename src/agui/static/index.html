<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edge Vision MCP</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header">
        <div class="header-left">
            <h1>Edge Vision MCP</h1>
            <span id="connection-status" class="status-badge offline">OFFLINE</span>
        </div>
        <div class="header-right">
            <div class="metric"><span class="metric-label">CPU</span><span id="cpu" class="metric-value">--%</span></div>
            <div class="metric"><span class="metric-label">TPU</span><span id="tpu" class="metric-value">--%</span></div>
            <div class="metric"><span class="metric-label">RAM</span><span id="ram" class="metric-value">-- GB</span></div>
            <div class="metric"><span class="metric-label">Protocol</span><span id="protocol" class="metric-value">--</span></div>
        </div>
    </header>

    <main class="main">
        <section class="camera-grid" id="camera-grid">
            <!-- 16 camera tiles injected by JS -->
        </section>

        <aside class="sidebar">
            <div class="panel alerts-panel">
                <h2>Alerts</h2>
                <div id="alerts-list" class="alerts-list">
                    <div class="empty-state">No alerts</div>
                </div>
            </div>
            <div class="panel metrics-panel">
                <h2>System Metrics</h2>
                <div class="metric-bar">
                    <div class="metric-bar-label">CPU</div>
                    <div class="metric-bar-track"><div id="cpu-bar" class="metric-bar-fill" style="width:0%"></div></div>
                </div>
                <div class="metric-bar">
                    <div class="metric-bar-label">TPU</div>
                    <div class="metric-bar-track"><div id="tpu-bar" class="metric-bar-fill" style="width:0%"></div></div>
                </div>
                <div class="metric-bar">
                    <div class="metric-bar-label">RAM</div>
                    <div class="metric-bar-track"><div id="ram-bar" class="metric-bar-fill" style="width:0%"></div></div>
                </div>
                <div class="metric-row">
                    <span>Streams:</span><span id="streams-count">--/16</span>
                </div>
                <div class="metric-row">
                    <span>Latency p95:</span><span id="latency-p95">-- ms</span>
                </div>
                <div class="metric-row">
                    <span>Clients:</span><span id="clients-count">--</span>
                </div>
            </div>
        </aside>
    </main>

    <script src="app.js"></script>
</body>
</html>
